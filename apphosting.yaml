# Firebase App Hosting — backend criado na região southamerica-east1 (São Paulo).
runConfig:
  minInstances: 0
  maxInstances: 4
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: portal-firebase-api-key
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: portal.propaga.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: propaga-portal
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: portal-firebase-app-id
